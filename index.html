<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scansoriana">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <title>Scansoriana</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        :root {
            --bg: #000000;
            --surface: #1c1c1e;
            --surface-2: #2c2c2e;
            --surface-3: #3a3a3c;
            --separator: rgba(84, 84, 88, 0.34);
            --label: #8e8e93;
            --text: #ffffff;
            --text-secondary: #aeaeb2;
            --blue: #0a84ff;
            --blue-bright: #409cff;
            --green: #30d158;
            --red: #ff453a;
            --orange: #ff9f0a;
            --yellow: #ffd60a;
            --purple: #bf5af2;
            --teal: #64d2ff;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 22px;
            --radius-2xl: 28px;
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.6);
            --tabbar-h: 76px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            -webkit-user-select: none;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            max-width: 520px;
            margin: 0 auto;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: calc(var(--safe-top) + 14px) 20px 12px 20px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: saturate(180%) blur(24px);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            border-bottom: 0.5px solid var(--separator);
        }

        .app-header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .app-title-block { flex: 1; min-width: 0; }

        .app-title {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.6px;
            line-height: 1.05;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .app-subtitle {
            font-size: 0.75rem;
            color: var(--label);
            font-weight: 500;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .db-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 100px;
            font-weight: 600;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }

        .db-badge.sqlite { color: var(--green); background: rgba(48, 209, 88, 0.12); }
        .db-badge.fallback { color: var(--orange); background: rgba(255, 159, 10, 0.12); }
        .db-badge.error { color: var(--red); background: rgba(255, 69, 58, 0.12); }

        .header-stats { display: flex; gap: 8px; }

        .stat-chip {
            background: var(--surface);
            padding: 8px 12px;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 56px;
            border: 0.5px solid var(--separator);
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.4px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .stat-value.blue { color: var(--blue-bright); }
        .stat-value.green { color: var(--green); }

        .stat-label {
            font-size: 0.6rem;
            color: var(--label);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 3px;
        }

        .app-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 16px);
        }

        .tab-panel {
            display: none;
            padding: 16px 20px 20px 20px;
            animation: tabFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tab-panel.active { display: block; }

        @keyframes tabFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section { margin-bottom: 24px; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--label);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .section-action {
            background: none;
            border: none;
            color: var(--blue);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            font-family: inherit;
        }

        .section-action:active { background: rgba(10, 132, 255, 0.15); }

        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 0.5px solid var(--separator);
            overflow: hidden;
        }

        .card-padded { padding: 16px; }

        .scanner-card {
            background: linear-gradient(145deg, #1c1c1e 0%, #161618 100%);
            border-radius: var(--radius-xl);
            border: 0.5px solid var(--separator);
            overflow: hidden;
            position: relative;
        }

        .scanner-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(10, 132, 255, 0.5), transparent);
        }

        .scanner-header {
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 0.5px solid var(--separator);
        }

        .scanner-status { display: flex; align-items: center; gap: 8px; }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px currentColor;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.blue { background: var(--blue); }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.85); }
        }

        .scanner-status-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
        }

        .scanner-status-text small {
            display: block;
            font-size: 0.7rem;
            color: var(--label);
            font-weight: 500;
            margin-top: 1px;
        }

        .btn-cam {
            background: var(--blue);
            border: none;
            padding: 8px 14px;
            border-radius: 100px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            -webkit-appearance: none;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
        }

        .btn-cam:active {
            transform: scale(0.94);
            box-shadow: 0 2px 6px rgba(10, 132, 255, 0.4);
        }

        #reader {
            width: 100%;
            background: #000;
            min-height: 300px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scanner-placeholder {
            text-align: center;
            color: var(--label);
            pointer-events: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .scanner-placeholder-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(48, 209, 88, 0.1);
            border: 1px solid rgba(48, 209, 88, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px auto;
            color: var(--green);
            font-size: 1.6rem;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .scanner-placeholder p { font-size: 0.85rem; font-weight: 500; }

        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 240px;
            height: 170px;
            border-radius: 16px;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.5);
        }

        .scan-overlay::before,
        .scan-overlay::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: var(--blue-bright);
            border-style: solid;
        }

        .scan-overlay::before {
            top: -2px;
            left: -2px;
            border-width: 3px 0 0 3px;
            border-radius: 16px 0 0 0;
        }

        .scan-overlay::after {
            bottom: -2px;
            right: -2px;
            border-width: 0 3px 3px 0;
            border-radius: 0 0 16px 0;
        }

        .scan-line {
            position: absolute;
            left: 10%;
            right: 10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--blue-bright), transparent);
            animation: scanMove 2s ease-in-out infinite;
            z-index: 11;
            pointer-events: none;
            filter: drop-shadow(0 0 8px var(--blue-bright));
        }

        @keyframes scanMove {
            0%, 100% { top: 20%; opacity: 0; }
            50% { top: 80%; opacity: 1; }
        }

        .scan-result {
            background: var(--surface-2);
            padding: 12px 16px;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 0.8rem;
            color: var(--label);
            border-top: 0.5px solid var(--separator);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scan-result span {
            color: var(--text);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.3px;
        }

        .form-group { margin-bottom: 12px; }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--label);
            margin-bottom: 6px;
            padding-left: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            background: var(--surface);
            border: 0.5px solid var(--separator);
            border-radius: var(--radius-md);
            color: var(--text);
            font-size: 1rem;
            font-weight: 500;
            -webkit-appearance: none;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--blue);
            background: var(--surface-2);
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.15);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder { color: var(--label); }

        .input-with-suffix { position: relative; }
        .input-with-suffix input { padding-right: 70px; }

        .input-suffix {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.75rem;
            color: var(--label);
            font-weight: 600;
            pointer-events: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            -webkit-appearance: none;
            font-family: inherit;
            width: 100%;
        }

        .btn:active { transform: scale(0.96); }

        .btn-primary {
            background: var(--blue);
            color: white;
            box-shadow: 0 4px 16px rgba(10, 132, 255, 0.3);
        }

        .btn-secondary {
            background: var(--surface-2);
            color: var(--text);
            border: 0.5px solid var(--separator);
        }

        .btn-green {
            background: var(--green);
            color: #000;
            box-shadow: 0 4px 16px rgba(48, 209, 88, 0.3);
        }

        .product-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 0.5px solid var(--separator);
            margin-bottom: 10px;
            overflow: hidden;
            position: relative;
            animation: cardFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .product-card:active {
            transform: scale(0.985);
            background: var(--surface-2);
        }

        .product-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--blue), var(--purple));
        }

        .product-body { padding: 14px 16px 12px 18px; }

        .product-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .product-info { flex: 1; min-width: 0; }

        .product-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
            letter-spacing: -0.2px;
            margin-bottom: 4px;
            word-wrap: break-word;
        }

        .product-brand {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 6px;
        }

        .product-brand i { color: var(--purple); }

        .product-material {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(191, 90, 242, 0.15);
            color: var(--purple);
            padding: 3px 10px;
            border-radius: 100px;
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 6px;
            font-family: 'SF Mono', monospace;
            letter-spacing: 0.3px;
        }

        .product-code {
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 0.7rem;
            background: var(--surface-3);
            padding: 3px 10px;
            border-radius: 100px;
            color: var(--teal);
            display: inline-block;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .product-qty {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--green);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.8px;
            line-height: 1;
            text-align: right;
            flex-shrink: 0;
        }

        .product-qty small {
            display: block;
            font-size: 0.6rem;
            color: var(--label);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .product-meta {
            font-size: 0.7rem;
            color: var(--label);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
            padding: 10px 14px 12px 18px;
            border-top: 0.5px solid var(--separator);
            background: rgba(0, 0, 0, 0.15);
        }

        .icon-btn {
            flex: 1;
            background: var(--surface-2);
            border: 0.5px solid var(--separator);
            padding: 9px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 600;
            -webkit-appearance: none;
            font-family: inherit;
        }

        .icon-btn:active {
            transform: scale(0.95);
            background: var(--surface-3);
        }

        .icon-btn.danger { color: var(--red); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--label);
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--surface);
            border: 0.5px solid var(--separator);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 2rem;
            color: var(--label);
            opacity: 0.6;
        }

        .empty-state h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 520px;
            height: calc(var(--tabbar-h) + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: rgba(20, 20, 22, 0.82);
            backdrop-filter: saturate(180%) blur(28px);
            -webkit-backdrop-filter: saturate(180%) blur(28px);
            border-top: 0.5px solid var(--separator);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 200;
        }

        .tab-item {
            flex: 1;
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 8px 4px;
            color: var(--label);
            font-family: inherit;
            cursor: pointer;
            position: relative;
            -webkit-appearance: none;
        }

        .tab-item i { font-size: 1.35rem; }

        .tab-item span {
            font-size: 0.65rem;
            font-weight: 600;
        }

        .tab-item.active { color: var(--blue-bright); }

        .tab-item.active i {
            filter: drop-shadow(0 0 8px rgba(10, 132, 255, 0.5));
        }

        .tab-badge {
            position: absolute;
            top: 4px;
            right: 50%;
            transform: translateX(14px);
            background: var(--red);
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 100px;
            min-width: 18px;
            text-align: center;
            line-height: 1.2;
        }

        .toast-msg {
            position: fixed;
            bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 16px);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(28, 28, 30, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            color: var(--text);
            padding: 12px 20px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 3000;
            animation: toastSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            box-shadow: var(--shadow-lg);
            border: 0.5px solid var(--separator);
            white-space: nowrap;
            max-width: 90vw;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast-msg.toast-success { border-color: rgba(48, 209, 88, 0.3); }
        .toast-msg.toast-error { border-color: rgba(255, 69, 58, 0.3); }
        .toast-msg.toast-warning { border-color: rgba(255, 159, 10, 0.3); }

        @keyframes toastSlideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-sheet {
            background: var(--surface);
            width: 100%;
            max-width: 520px;
            border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
            padding: 8px 0 calc(24px + var(--safe-bottom)) 0;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.6);
        }

        .modal-overlay.active .modal-sheet { transform: translateY(0); }

        .modal-handle {
            width: 36px;
            height: 5px;
            background: var(--surface-3);
            border-radius: 3px;
            margin: 0 auto 16px auto;
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 800;
            text-align: center;
            padding: 0 20px 8px 20px;
            letter-spacing: -0.4px;
        }

        .modal-message {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: center;
            padding: 0 24px 20px 24px;
            line-height: 1.5;
        }

        .modal-actions {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-btn {
            width: 100%;
            padding: 15px;
            border-radius: var(--radius-md);
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            -webkit-appearance: none;
            font-family: inherit;
            letter-spacing: -0.2px;
        }

        .modal-btn:active {
            transform: scale(0.97);
            opacity: 0.85;
        }

        .modal-btn-primary {
            background: var(--blue);
            color: white;
            box-shadow: 0 4px 16px rgba(10, 132, 255, 0.3);
        }

        .modal-btn-danger {
            background: var(--red);
            color: white;
        }

        .modal-btn-secondary {
            background: var(--surface-2);
            color: var(--text);
            border: 0.5px solid var(--separator);
        }

        .modal-btn-cancel {
            background: transparent;
            color: var(--blue);
            margin-top: 6px;
            font-weight: 600;
        }

        .scan-success-icon {
            width: 68px;
            height: 68px;
            background: rgba(48, 209, 88, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            color: var(--green);
            font-size: 1.9rem;
            border: 1px solid rgba(48, 209, 88, 0.25);
        }

        .scan-success-icon.error {
            background: rgba(255, 69, 58, 0.15);
            color: var(--red);
            border-color: rgba(255, 69, 58, 0.25);
        }

        .scan-success-icon.warning {
            background: rgba(255, 159, 10, 0.15);
            color: var(--orange);
            border-color: rgba(255, 159, 10, 0.25);
        }

        .modal-product-info {
            background: var(--surface-2);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin: 0 16px 16px 16px;
            border: 0.5px solid var(--separator);
        }

        .modal-product-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .modal-product-code {
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 0.78rem;
            color: var(--teal);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .modal-input-label {
            font-size: 0.7rem;
            color: var(--label);
            text-align: center;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 700;
        }

        .stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 0 16px 20px 16px;
        }

        .stepper-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--surface-2);
            border: 0.5px solid var(--separator);
            color: var(--blue-bright);
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-appearance: none;
            font-family: inherit;
        }

        .stepper-btn:active {
            transform: scale(0.88);
            background: var(--surface-3);
        }

        .stepper-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text);
            min-width: 70px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
        }

        .settings-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 1500;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            transform: translateY(20px);
        }

        .settings-overlay.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .settings-header {
            position: sticky;
            top: 0;
            padding: calc(var(--safe-top) + 16px) 20px 14px 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: saturate(180%) blur(24px);
            -webkit-backdrop-filter: saturate(180%) blur(24px);
            border-bottom: 0.5px solid var(--separator);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .settings-header h2 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-header h2 i { color: var(--blue-bright); }

        .settings-close {
            background: var(--surface-2);
            border: 0.5px solid var(--separator);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: var(--text);
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-appearance: none;
        }

        .settings-close:active {
            transform: scale(0.88);
            background: var(--surface-3);
        }

        .settings-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 20px calc(40px + var(--safe-bottom)) 20px;
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
        }

        .settings-section { margin-bottom: 24px; }

        .settings-section-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--label);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .manual-panel {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 0.5px solid var(--separator);
            padding: 16px;
        }

        .db-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .db-stats span { color: var(--label); }
        .db-stats strong { color: var(--blue-bright); font-size: 1.1rem; font-weight: 800; }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: var(--surface-3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--blue);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(10, 132, 255, 0.4);
            border: 2px solid #fff;
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--blue);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(10, 132, 255, 0.4);
            border: 2px solid #fff;
        }

        #scannerInput {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        ::-webkit-scrollbar { width: 0; height: 0; }
        .mt-8 { margin-top: 8px; }

        @media (min-width: 768px) {
            .app { border-left: 0.5px solid var(--separator); border-right: 0.5px solid var(--separator); }
        }
    </style>
</head>
<body>

<div class="app">

    <header class="app-header">
        <div class="app-header-inner">
            <div class="app-title-block">
                <div class="app-title" id="headerTitle">Escáner</div>
                <div class="app-subtitle">
                    <span>Honeywell EDA5S</span>
                    <span class="db-badge" id="dbStatusBadge">⏳</span>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat-chip">
                    <div class="stat-value blue" id="totalProductos">0</div>
                    <div class="stat-label">SKU</div>
                </div>
                <div class="stat-chip">
                    <div class="stat-value green" id="totalCajasSum">0</div>
                    <div class="stat-label">Cajas</div>
                </div>
            </div>
        </div>
    </header>

    <main class="app-content">

        <section class="tab-panel active" id="tab-escaner">

            <div class="section">
                <button class="btn btn-green" id="iniciarTarimaBtn" style="padding:16px;">
                    <i class="fas fa-pallet"></i> Iniciar nueva tarima
                </button>
            </div>

            <div class="section" id="tarimaBanner" style="display:none;"></div>

            <div class="section">
                <div class="section-header">
                    <div class="section-title">Escáner</div>
                    <span class="status-dot" id="scannerDot"></span>
                </div>
                <div class="scanner-card">
                    <div class="scanner-header">
                        <div class="scanner-status">
                            <div>
                                <div class="scanner-status-text">
                                    <span id="scannerModeLabel">Láser</span>
                                    <small id="scannerModeSub">Activo · Listo para escanear</small>
                                </div>
                            </div>
                        </div>
                        <button class="btn-cam" id="startScannerBtn">
                            <i class="fas fa-camera"></i> Cámara
                        </button>
                    </div>
                    <div id="reader">
                        <div class="scan-overlay"></div>
                        <div class="scan-line"></div>
                        <div class="scanner-placeholder">
                            <div class="scanner-placeholder-icon">
                                <i class="fas fa-bolt"></i>
                            </div>
                            <p>Apunta y escanea</p>
                        </div>
                    </div>
                    <div class="scan-result">
                        <i class="fas fa-barcode" style="color:var(--label);"></i>
                        <span id="lastScanned">Esperando código...</span>
                    </div>
                </div>
            </div>

        </section>

        <section class="tab-panel" id="tab-inventario">

            <!-- ✅ CAPTURA MANUAL MOVIDA A INVENTARIO -->
            <div class="section">
                <div class="section-header">
                    <div class="section-title">Captura manual</div>
                </div>
                <div class="card card-padded">
                    <div class="form-group">
                        <label>Código de barras</label>
                        <input type="text" id="manualCode" placeholder="Ej: 7501234567890" inputmode="numeric" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>Cantidad de cajas</label>
                        <div class="input-with-suffix">
                            <input type="number" id="cajasQuantity" value="1" min="1" step="1" inputmode="numeric">
                            <span class="input-suffix">caja(s)</span>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="addManualBtn">
                        <i class="fas fa-search"></i> Buscar y agregar
                    </button>
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <div class="section-title">Productos registrados</div>
                    <button class="section-action" id="exportExcelBtn">
                        <i class="fas fa-file-export"></i> CSV
                    </button>
                </div>
                <div id="productsList">
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-qrcode"></i>
                        </div>
                        <h3>Sin productos</h3>
                        <p>Escanea un código para comenzar tu inventario</p>
                    </div>
                </div>
            </div>

            <div class="section">
                <button class="btn btn-secondary" id="resetAllBtn">
                    <i class="fas fa-trash-alt"></i> Reiniciar inventario
                </button>
            </div>
        </section>

    </main>

    <nav class="tab-bar">
        <button class="tab-item active" data-tab="escaner">
            <i class="fas fa-bolt"></i>
            <span>Escanear</span>
        </button>
        <button class="tab-item" data-tab="inventario">
            <i class="fas fa-boxes"></i>
            <span>Inventario</span>
            <span class="tab-badge" id="tabBadgeCount" style="display:none;">0</span>
        </button>
        <button class="tab-item" data-tab="ajustes">
            <i class="fas fa-database"></i>
            <span>Base de datos</span>
        </button>
    </nav>

</div>

<input type="text" id="scannerInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="none">

<div class="settings-overlay" id="settingsOverlay">
    <div class="settings-header">
        <h2><i class="fas fa-database"></i> Base de Datos</h2>
        <button class="settings-close" id="settingsClose">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div class="settings-content" id="settingsContent">
        <!-- DBManager inyecta aquí -->
    </div>
</div>

<!-- ================= SCRIPTS ================= -->
<script src="https://sql.js.org/dist/sql-wasm.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="catalogs.js"></script>
<script src="database.js"></script>
<script src="app.js"></script>
<script src="db-manager.js"></script>

<script>
    // ================= PWA: SERVICE WORKER =================
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => {
                console.warn('SW registration failed:', err);
            });
        });
    }

    // ================= NAVEGACIÓN POR TABS =================
    (function() {
        const tabs = document.querySelectorAll('.tab-item');
        const panels = document.querySelectorAll('.tab-panel');
        const title = document.getElementById('headerTitle');
        const titles = { escaner: 'Escáner', inventario: 'Inventario', ajustes: 'Base de datos' };

        function switchTab(name) {
            tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === name));
            panels.forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
            if (title) title.textContent = titles[name] || 'Scansoriana';

            if (name === 'ajustes') {
                if (typeof window.abrirSettings === 'function') {
                    window.abrirSettings();
                } else {
                    console.warn('⚠️ abrirSettings no está definida todavía');
                }
            }

            if (name === 'inventario' && typeof renderizarProductos === 'function') {
                renderizarProductos();
                // En Inventario NO queremos que el scanner robe el foco
                if (typeof detenerFocoScanner === 'function') detenerFocoScanner();
            }

            // Al volver a Escáner, reactivar el foco del láser
            if (name === 'escaner' && typeof reiniciarFocoScanner === 'function') {
                reiniciarFocoScanner();
            }
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });

        window.switchTab = switchTab;

        document.addEventListener('settings:closed', () => {
            tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === 'escaner'));
            panels.forEach(p => p.classList.toggle('active', p.id === 'tab-escaner'));
            if (title) title.textContent = 'Escáner';
        });
    })();

    // ================= BADGE DE INVENTARIO =================
    (function() {
        const badge = document.getElementById('tabBadgeCount');
        const totalEl = document.getElementById('totalProductos');
        if (!badge || !totalEl) return;

        const update = () => {
            const n = parseInt(totalEl.textContent) || 0;
            badge.textContent = n > 99 ? '99+' : n;
            badge.style.display = n > 0 ? 'block' : 'none';
        };

        new MutationObserver(update).observe(totalEl, {
            childList: true,
            characterData: true,
            subtree: true
        });
        update();
    })();
</script>

</body>
</html>
